name: "websocket 2.1.0 preview"
description: >-
  TEMPORARY until com.ditchoom:websocket 2.1.0 is on Maven Central. Builds the unreleased
  DitchOoM/websocket 2.1.0 branch into this runner's mavenLocal as 2.1.0-SNAPSHOT and points every
  later Gradle invocation in the job at it. Delete this action and its `uses:` lines once 2.1.0 ships.
inputs:
  ref:
    description: "websocket branch to build"
    required: false
    default: "websocket-2.1.0-catchup"
runs:
  using: composite
  steps:
    - name: Resolve websocket preview commit
      id: sha
      shell: bash
      run: |
        sha=$(git ls-remote https://github.com/DitchOoM/websocket.git "refs/heads/${{ inputs.ref }}" | cut -f1)
        test -n "$sha" || { echo "::error::branch ${{ inputs.ref }} not found on DitchOoM/websocket"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Restore websocket preview artifacts
      id: cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.m2/repository/com/ditchoom/websocket*/2.1.0-SNAPSHOT
        key: websocket-preview-${{ runner.os }}-${{ runner.arch }}-${{ steps.sha.outputs.sha }}

    - name: Check out websocket preview
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: DitchOoM/websocket
        ref: ${{ steps.sha.outputs.sha }}
        path: .websocket-preview

    # Snapshot mode (no GITHUB_REPOSITORY) plus incrementMinor yields 2.1.0-SNAPSHOT. That branch
    # still compiles Android against SDK 36 while socket 4.24's AARs require 37, so this throwaway
    # checkout is built against 37, as mqtt is.
    - name: Publish websocket preview to mavenLocal
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: .websocket-preview
      env:
        LOCAL_SINGLE_HOST_PUBLISH: "true"
      run: |
        sed -i.bak 's/compileSdk = 36/compileSdk = 37/' build.gradle.kts websocket-tcp/build.gradle.kts
        env -u GITHUB_REPOSITORY ./gradlew publishToMavenLocal -PincrementMinor=true -x test --no-configuration-cache

    - name: Point Gradle at the preview
      shell: bash
      run: |
        rm -rf .websocket-preview
        echo "ORG_GRADLE_PROJECT_ditchoomWebsocketVersion=2.1.0-SNAPSHOT" >> "$GITHUB_ENV"
