# Interop broker for .github/workflows/interop.yaml. Plain TCP, TLS with the certificate CI
# generates, and WebSocket; anonymous access; a small in-flight window so the client's send
# quota is exercised (advertised to MQTT 5 clients as Receive Maximum).
per_listener_settings false
allow_anonymous true
max_inflight_messages 10
persistence false

listener 1883 0.0.0.0

listener 8883 0.0.0.0
certfile /certs/server.crt
keyfile /certs/server.key

listener 8080 0.0.0.0
protocol websockets
