name: "Binary compatibility"

# checkKotlinAbi compares every published module's public ABI (JVM, Android and the klib dump
# for JS, Wasm and Apple) with the dumps committed under each module's api/ directory. It runs on
# macOS because only a macOS host declares the full target set the klib dump records. After an
# intentional API change: ./gradlew updateKotlinAbi (on a Mac) and commit the api/ files.

on:
  workflow_call:
    inputs:
      upstream:
        description: "auto, or central for a release (.github/actions/upstream-from-source)"
        required: false
        default: "auto"
        type: string
      socket-ref:
        description: "DitchOoM/socket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      websocket-ref:
        description: "DitchOoM/websocket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string

jobs:
  api-check:
    name: "checkKotlinAbi (JVM, Android, klib)"
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      # socket and websocket from Maven Central, or built from source when a ref input is set or the
      # catalog pins a version Central does not have yet (.github/actions/upstream-from-source).
      - name: Upstream libraries
        uses: ./.github/actions/upstream-from-source
        with:
          mode: ${{ inputs.upstream || 'auto' }}
          socket-ref: ${{ inputs.socket-ref }}
          websocket-ref: ${{ inputs.websocket-ref }}

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      - name: Check public ABI
        run: ./gradlew checkKotlinAbi

      - name: Show the ABI diff
        if: failure()
        run: |
          ./gradlew updateKotlinAbi -q || true
          git --no-pager diff --stat -- '*/api/*'
          git --no-pager diff -- '*/api/*' | head -300
