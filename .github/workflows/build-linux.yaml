name: "Build & Test (Linux)"

on:
  workflow_call:
    inputs:
      upstream:
        description: "auto, or central for a release (.github/actions/upstream-from-source)"
        required: false
        default: "auto"
        type: string
      socket-ref:
        description: "DitchOoM/socket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      websocket-ref:
        description: "DitchOoM/websocket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true)"
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "Computed next version"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: "Linux / JVM / JS / Android"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      # socket and websocket from Maven Central, or built from source when a ref input is set or the
      # catalog pins a version Central does not have yet (.github/actions/upstream-from-source).
      - name: Upstream libraries
        uses: ./.github/actions/upstream-from-source
        with:
          mode: ${{ inputs.upstream || 'auto' }}
          socket-ref: ${{ inputs.socket-ref }}
          websocket-ref: ${{ inputs.websocket-ref }}

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Konan
        uses: actions/cache@v5
        with:
          path: ~/.konan
          # Keyed on the version catalog only — the konan toolchain tracks the
          # Kotlin version, not every build.gradle.kts edit — so the cache is
          # reused across pure build-script changes.
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-linux-

      - name: Cache Gradle build outputs
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q :mqtt-client:nextVersion ${{ inputs.gradle-args }})" >> $GITHUB_OUTPUT

      # linuxX64Test for native test-execution parity (JVM behaviour differs from native memory/lifecycle).
      - name: Run JVM / JS / Android / Linux-native tests
        run: >-
          ./gradlew ktlintCheck
          jvmTest jsNodeTest jsBrowserTest
          testDebugUnitTest
          linuxX64Test
          ${{ inputs.gradle-args }}

      # A release resolves every dependency from Maven Central; this fails if one came from mavenLocal.
      - name: Verify dependencies resolved from Maven Central only
        if: inputs.upstream == 'central'
        run: ./gradlew verifyCentralOnly ${{ inputs.gradle-args }}

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-build-cache ${{ inputs.gradle-args }}

      - name: Upload Maven local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-linux
          path: ~/.m2/repository/com/ditchoom
          retention-days: 3
