name: "Build & Test (Linux)"

on:
  workflow_call:
    inputs:
      gradle-args:
        description: "Extra Gradle arguments (e.g., -PincrementMinor=true)"
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "Computed next version"
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    name: "Linux / JVM / JS / Android"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          # Keyed on the version catalog only — the konan toolchain tracks the
          # Kotlin version, not every build.gradle.kts edit — so the cache is
          # reused across pure build-script changes.
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-linux-

      - name: Cache Gradle build outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      - name: Get version
        id: version
        run: echo "version=$(./gradlew -q :mqtt-client:nextVersion ${{ inputs.gradle-args }})" >> $GITHUB_OUTPUT

      # linuxX64Test added for native test-execution parity (JVM behaviour ≠ native memory/lifecycle).
      - name: Run JVM / JS / Android / Linux-native tests
        run: >-
          ./gradlew ktlintCheck
          jvmTest jsNodeTest jsBrowserTest
          testDebugUnitTest testReleaseUnitTest
          linuxX64Test
          ${{ inputs.gradle-args }}

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --no-build-cache ${{ inputs.gradle-args }}

      - name: Upload Maven local artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-linux
          path: ~/.m2/repository/com/ditchoom
          retention-days: 3
