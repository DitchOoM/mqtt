name: "Fuzz"

# Optional / non-blocking: this workflow is intentionally NOT referenced by review.yaml,
# so it never gates PR merges. Deterministic fuzzing runs on every PR; coverage-guided
# Jazzer fuzzing runs on the weekly schedule and on manual dispatch (PRs only replay the
# committed seed/crash corpus as fast regression tests).

on:
  pull_request:
    paths-ignore:
      - '*.md'
    types: [synchronize, opened]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0' # weekly, Sunday 03:17 UTC

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-fuzz:
    name: "Deterministic fuzz (JVM / JS / Linux-native)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      - name: Cache Konan
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: konan-linux-

      - name: Cache Gradle build outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      # Seeded structure-aware fuzzing of the v4/v5 control-packet decoders and the
      # remaining-length VBI codec. Failures print the seed + a hex dump of the input.
      - name: Run deterministic fuzz tests
        run: >-
          ./gradlew -PfuzzTests
          :models-base:jvmTest :models-base:jsNodeTest :models-base:linuxX64Test
          :models-v4:jvmTest :models-v4:jsNodeTest :models-v4:linuxX64Test
          :models-v5:jvmTest :models-v5:jsNodeTest :models-v5:linuxX64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deterministic-fuzz-reports-${{ github.run_id }}
          path: |
            models-base/build/reports/tests
            models-v4/build/reports/tests
            models-v5/build/reports/tests
          retention-days: 7

  jazzer-fuzz:
    name: "Jazzer (regression on PR, fuzz on schedule/dispatch)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      - name: Cache Gradle build outputs
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: gradle-linux-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-linux-

      # jazzer-junit maintains its generated corpus per-module under <module>/.cifuzz-corpus
      # (gitignored); persist it across runs so coverage compounds week over week.
      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: |
            models-v4/.cifuzz-corpus
            models-v5/.cifuzz-corpus
          key: jazzer-corpus-${{ github.run_id }}
          restore-keys: jazzer-corpus-

      - name: Jazzer regression replay (PR)
        if: github.event_name == 'pull_request'
        run: >-
          ./gradlew -PfuzzTests
          :models-v4:jvmTest :models-v5:jvmTest
          --tests '*JazzerFuzzTest'

      # Real coverage-guided fuzzing (libFuzzer); bounded by @FuzzTest(maxDuration = "10m")
      # per target plus the job timeout.
      - name: Jazzer fuzzing (schedule / dispatch)
        if: github.event_name != 'pull_request'
        env:
          JAZZER_FUZZ: "1"
        run: >-
          ./gradlew -PfuzzTests
          :models-v4:jvmTest :models-v5:jvmTest
          --tests '*JazzerFuzzTest'

      # New crashers are written into the <ClassName>Inputs resource directories — commit
      # them as permanent regression cases after triage.
      - name: Upload crash inputs + corpus
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jazzer-crashes-${{ github.run_id }}
          path: |
            models-v4/src/jvmTest/resources/**/crash-*
            models-v5/src/jvmTest/resources/**/crash-*
            models-v4/.cifuzz-corpus
            models-v5/.cifuzz-corpus
          retention-days: 14
