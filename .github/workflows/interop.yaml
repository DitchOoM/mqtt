name: "Broker interop"

# Real-broker interop matrix: brokers x MQTT versions x transports. Each cell starts one pinned
# broker container (.github/interop/start-broker.sh owns image tags, ports and configs) and runs
# BrokerInteropTest against it: QoS 0/1/2 round trips, retained messages, session resume,
# Receive Maximum (MQTT 5) and the #12 concurrency stress.
#
# The brokers run with `docker run` after checkout rather than as `services:`, because every
# broker needs this repo's config files and the TLS certificate CI generates mounted into it.

on:
  pull_request:
    paths-ignore:
      - '*.md'
    types: [synchronize, opened]
  workflow_dispatch:
    inputs:
      socket-ref:
        description: "DitchOoM/socket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      websocket-ref:
        description: "DitchOoM/websocket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      upstream:
        description: "auto, or central for a release (.github/actions/upstream-from-source)"
        required: false
        default: "auto"
        type: string
      socket-ref:
        description: "DitchOoM/socket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      websocket-ref:
        description: "DitchOoM/websocket branch, tag or commit to build from source"
        required: false
        default: ""
        type: string
      iterations:
        description: "How many times each cell repeats the stress test"
        type: number
        required: false
        default: 1

concurrency:
  group: interop-${{ github.ref }}-${{ inputs.iterations || 1 }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interop:
    name: "${{ matrix.broker }} · MQTT ${{ matrix.protocol }} · ${{ matrix.transport }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        broker: [mosquitto, emqx, hivemq]
        protocol: ["4", "5"]
        transport: [tcp, tls, ws]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      # socket and websocket from Maven Central, or built from source when a ref input is set or the
      # catalog pins a version Central does not have yet (.github/actions/upstream-from-source).
      - name: Upstream libraries
        uses: ./.github/actions/upstream-from-source
        with:
          mode: ${{ inputs.upstream || 'auto' }}
          socket-ref: ${{ inputs.socket-ref }}
          websocket-ref: ${{ inputs.websocket-ref }}

      - name: Start ${{ matrix.broker }}
        run: .github/interop/start-broker.sh ${{ matrix.broker }} ${{ matrix.transport }} ${{ matrix.protocol }}

      - name: Interop tests
        run: |
          for i in $(seq 1 ${{ inputs.iterations || 1 }}); do
            echo "::group::iteration $i"
            if [ "$i" = 1 ]; then filter='*BrokerInteropTest*'; else filter='*BrokerInteropTest.concurrentMixedQos*'; fi
            ./gradlew :mqtt-client:jvmTest -PinteropTests --tests "$filter" --rerun --no-configuration-cache
            echo "::endgroup::"
          done

      - name: Broker log
        if: failure()
        run: docker logs broker 2>&1 | tail -200

      - name: Summary row
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          cell = "${{ matrix.broker }} · MQTT ${{ matrix.protocol }} · ${{ matrix.transport }}"
          rows = []
          for p in glob.glob("mqtt-client/build/test-results/jvmTest/*BrokerInteropTest*.xml"):
              for tc in ET.parse(p).getroot().iter("testcase"):
                  failed = tc.find("failure") is not None or tc.find("error") is not None
                  rows.append(f"| {cell} | {tc.get('name').split('[')[0]} | {'FAIL' if failed else 'PASS'} | {float(tc.get('time')):.1f}s |")
          print("| cell | test | result | time |\n|---|---|---|---|")
          print("\n".join(rows) if rows else f"| {cell} | (no results) | FAIL | |")
          PY

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-${{ matrix.broker }}-${{ matrix.protocol }}-${{ matrix.transport }}
          path: mqtt-client/build/reports/tests/jvmTest
          retention-days: 7
