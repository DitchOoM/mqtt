name: "Build Test and Deploy"
on:
  pull_request_target:
    branches: [ main ]
    types:
      - closed
  workflow_dispatch:
    inputs:
      version-bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      flow:
        description: "Release flow"
        type: choice
        options:
          - release
          - draft
          - dry-run
        default: release

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-release:
    name: Check if release is needed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      flow: ${{ steps.check.outputs.flow }}
      gradle-args: ${{ steps.check.outputs.gradle-args }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine release flow
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch has no PR to inspect — take flow and version
          # bump straight from the workflow inputs. Lets us recover from a
          # failed publish (e.g. transient Central API hiccup, or a merge
          # whose deploy was blocked) without opening a sham PR to flip the
          # classifier.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.version-bump }}" in
              major) echo "gradle-args=-PincrementMajor=true" >> $GITHUB_OUTPUT ;;
              minor) echo "gradle-args=-PincrementMinor=true" >> $GITHUB_OUTPUT ;;
              *)     echo "gradle-args=" >> $GITHUB_OUTPUT ;;
            esac
            echo "flow=${{ inputs.flow }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          gradle_args=""
          if ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            gradle_args="-PincrementMajor=true"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            gradle_args="-PincrementMinor=true"
          fi
          echo "gradle-args=${gradle_args}" >> $GITHUB_OUTPUT

          # Check for skip-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'skip-release') }}; then
            echo "flow=dry-run" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for draft-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'draft-release') }}; then
            echo "flow=draft" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if only non-code files changed.
          # Use the paginated "list PR files" API rather than `gh pr diff`:
          # the latter hits the .diff endpoint, which GitHub caps at ~20k
          # lines / 300 files and returns HTTP 406 for larger PRs (this is
          # exactly what blocked PR #14's deploy — 373 changed files, diff
          # rejected, script exited 1). The PR-files API returns objects with
          # a `filename` field and is paginated, so size-of-change doesn't matter.
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          for file in $changed_files; do
            case "$file" in
              .github/*|*.md|.gitignore|.editorconfig|CLAUDE.md|LICENSE|*.txt)
                ;;
              *)
                echo "Code file changed: $file"
                echo "flow=release" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
          done

          echo "Only non-code files changed, skipping"
          echo "flow=skip" >> $GITHUB_OUTPUT

  build-linux:
    needs: check-release
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-linux.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      upstream: central

  build-apple:
    needs: check-release
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-apple.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      upstream: central

  validate:
    needs: [check-release, build-linux, build-apple]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.build-linux.outputs.version }}

  publish:
    needs: [check-release, validate]
    if: needs.check-release.outputs.flow == 'draft' || needs.check-release.outputs.flow == 'release'
    uses: ./.github/workflows/publish-to-central.yaml
    with:
      publishing-type: ${{ needs.check-release.outputs.flow == 'draft' && 'USER_MANAGED' || 'AUTOMATIC' }}
      version: ${{ needs.build-linux.outputs.version }}
    secrets:
      GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  finalize:
    name: Finalize Release
    needs: [check-release, build-linux, publish]
    if: always() && needs.check-release.outputs.flow != 'skip' && needs.check-release.outputs.flow != 'dry-run'
    runs-on: ubuntu-latest
    # No checkout: every step drives `gh` against the remote. The tag is created by
    # `gh release create --target`, i.e. through the REST API. A `git push` of a tag with
    # GITHUB_TOKEN goes through receive-pack, which refuses refs that GitHub judges to add
    # .github/workflows/* changes unless the token has the `workflows` scope — after the
    # artifacts are already on Maven Central.
    #
    # RELEASE_SHA is github.sha: on `pull_request_target: closed` that is the merge commit on
    # main, the tree build-linux/build-apple checked out and `publish` shipped; on
    # workflow_dispatch it is the dispatched ref's head.
    steps:
      - name: Create draft GitHub release
        if: needs.check-release.outputs.flow == 'draft' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          version="${{ needs.build-linux.outputs.version }}"
          # PR context is empty on manual workflow_dispatch — fall back to generic notes.
          PR_TITLE="${PR_TITLE:-Release v${version}}"
          PR_URL="${PR_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}}"
          deployment_id="${{ needs.publish.outputs.deployment-id }}"
          staging_url="https://central.sonatype.com/publishing/deployments"

          gh release create "v${version}" \
              --draft \
              --repo="$GITHUB_REPOSITORY" \
              --target="$RELEASE_SHA" \
              --title="v${version}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Status:** Awaiting validation in [Maven Central Staging](${staging_url})
          **Deployment ID:** \`${deployment_id}\`

          ### To complete release:
          1. Validate artifacts in Maven Central staging area
          2. Run the 'Complete or Cancel Release' workflow with action 'complete' and version '${version}'

          ### To cancel:
          1. Run the 'Complete or Cancel Release' workflow with action 'cancel' and version '${version}'
          2. This will drop the deployment and delete this draft release
          EOF
          )"

      - name: Create tag and GitHub release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          version="${{ needs.build-linux.outputs.version }}"
          tag="v${version}"
          # PR context is empty on manual workflow_dispatch — fall back to generic notes.
          PR_TITLE="${PR_TITLE:-Release ${tag}}"
          PR_URL="${PR_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}}"

          # Idempotence is keyed on the release: a published release means done; a draft carries
          # no tag, so it is an error rather than "done".
          release_is_draft=$(gh release view "$tag" --repo="$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          case "$release_is_draft" in
            false)
              echo "Release $tag already exists — nothing to do."
              exit 0
              ;;
            true)
              echo "::error::A draft release ${tag} exists and carries no tag. Publish it with the 'Complete or Cancel Release' workflow or delete it, then re-run."
              exit 1
              ;;
          esac

          # Decide on the exit status: `gh api` prints its error body to stdout.
          if tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq '.sha' 2>/dev/null); then
            if ! printf '%s' "$tag_commit" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::Lookup of ${tag} returned '${tag_commit}', not a commit sha."
              exit 1
            fi
            echo "::notice::Tag ${tag} already exists (-> ${tag_commit}); creating the release on it."
            if [ "$tag_commit" != "$RELEASE_SHA" ]; then
              echo "::warning::${tag} points at ${tag_commit}, but this run built and published ${RELEASE_SHA}."
            fi
            target="$tag_commit"
          else
            default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${default_branch}...${RELEASE_SHA}" --jq '.status')
            case "$status" in
              identical|behind) ;;
              *)
                echo "::error::${RELEASE_SHA} is '${status}' relative to ${default_branch}; refusing to tag ${tag} off the default branch."
                exit 1
                ;;
            esac
            target="$RELEASE_SHA"
          fi

          maven_url="https://central.sonatype.com/artifact/com.ditchoom/mqtt-client/${version}"
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --target="$target" \
              --title="${tag}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Maven Central:** [com.ditchoom:mqtt-client:${version}](${maven_url})
          EOF
          )"
