name: "Nightly"

# Repeats the #12 send-quota stress until a flake would show, against the scripted broker
# (SendQuotaTest, JVM and linuxX64) and against every real broker cell (interop.yaml with
# iterations), and runs the fuzzers in coverage-guided mode.

on:
  schedule:
    - cron: '41 4 * * *' # daily, 04:41 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: "Stress iterations"
        type: number
        default: 20

permissions:
  contents: read

jobs:
  send-quota-stress:
    name: "SendQuotaTest x${{ inputs.iterations || 20 }} (${{ matrix.task }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        task: [jvmTest, linuxX64Test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      # TEMPORARY: websocket 2.1.0 is not on Maven Central yet (see gradle/libs.versions.toml).
      - name: Build websocket 2.1.0 preview
        uses: ./.github/actions/websocket-preview

      - name: Cache Konan
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-linux-

      - name: Stress
        run: |
          passed=0
          for i in $(seq 1 ${{ inputs.iterations || 20 }}); do
            echo "::group::iteration $i"
            ./gradlew :mqtt-client:${{ matrix.task }} --tests '*SendQuotaTest*' --rerun
            passed=$i
            echo "::endgroup::"
          done
          echo "| SendQuotaTest (${{ matrix.task }}) | $passed iterations green |" >> "$GITHUB_STEP_SUMMARY"

  broker-stress:
    uses: ./.github/workflows/interop.yaml
    with:
      iterations: ${{ inputs.iterations || 20 }}

  fuzz:
    uses: ./.github/workflows/fuzz.yaml

  summary:
    name: "Summary"
    if: always()
    needs: [send-quota-stress, broker-stress, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Nightly"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
