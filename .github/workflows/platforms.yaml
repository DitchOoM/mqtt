name: "Extra platforms"

# Hosts and targets the main Linux and Apple builds do not cover: arm64 Linux (JVM and JS on an
# arm64 JDK and Node; Kotlin/Native has no linux arm64 host), x86_64 macOS (the macosX64 native
# target), and the wasmJs targets. There is no Windows leg because
# mqtt declares no mingw target.

on:
  workflow_call:

jobs:
  platform:
    name: "${{ matrix.name }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.known-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux arm64 / JVM / JS"
            runner: ubuntu-24.04-arm
            tasks: jvmTest jsNodeTest
            known-failure: false
          - name: "macOS x86_64 / macosX64"
            runner: macos-15-intel
            tasks: macosX64Test
            known-failure: false
          # Known failure, so it reports without gating: under Kotlin 2.4.21 buffer 6.30.8's wasm
          # allocator calls WebAssembly.Memory.grow on a receiver that is not the module's memory
          # (green on Kotlin 2.4.0). Flip known-failure to false once buffer ships the fix.
          - name: "Linux / wasmJs (node + browser)"
            runner: ubuntu-24.04
            tasks: wasmJsNodeTest wasmJsBrowserTest
            known-failure: true
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle

      # TEMPORARY: websocket 2.1.0 is not on Maven Central yet (see gradle/libs.versions.toml).
      - name: Build websocket 2.1.0 preview
        uses: ./.github/actions/websocket-preview

      - name: Cache Konan
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: ./gradlew ${{ matrix.tasks }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-reports-${{ runner.os }}-${{ runner.arch }}
          path: "*/build/reports/tests"
          retention-days: 7
