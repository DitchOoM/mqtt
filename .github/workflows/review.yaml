name: "Build and Test"
on:
  pull_request:
    paths-ignore:
      - '*.md'
    types:
      - synchronize
      - opened

# Cancel superseded runs on the same PR branch when a new commit is pushed.
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: PR review only needs to read the repo.
permissions:
  contents: read

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yaml

  build-apple:
    uses: ./.github/workflows/build-apple.yaml

  validate:
    needs: [build-linux, build-apple]
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.build-linux.outputs.version }}
