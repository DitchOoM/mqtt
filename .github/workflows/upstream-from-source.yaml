name: "Upstream from source"
# Runs the PR gate and the broker interop matrix (TLS cells included) with socket and/or websocket
# built from the given ref, so mqtt can be tested against an upstream change before it is on Maven
# Central. Each library is published into mavenLocal at the version gradle/libs.versions.toml pins,
# so the catalog stays exactly as the release will resolve it.
on:
  workflow_dispatch:
    inputs:
      websocket-ref:
        description: "DitchOoM/websocket branch, tag or commit (empty: Maven Central, or .github/upstream-refs)"
        required: false
        default: ""
        type: string
      socket-ref:
        description: "DitchOoM/socket branch, tag or commit (empty: Maven Central, or .github/upstream-refs)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    uses: ./.github/workflows/build-linux.yaml
    with:
      socket-ref: ${{ inputs.socket-ref }}
      websocket-ref: ${{ inputs.websocket-ref }}

  build-apple:
    uses: ./.github/workflows/build-apple.yaml
    with:
      socket-ref: ${{ inputs.socket-ref }}
      websocket-ref: ${{ inputs.websocket-ref }}

  api-check:
    uses: ./.github/workflows/api-check.yaml
    with:
      socket-ref: ${{ inputs.socket-ref }}
      websocket-ref: ${{ inputs.websocket-ref }}

  platforms:
    uses: ./.github/workflows/platforms.yaml
    with:
      socket-ref: ${{ inputs.socket-ref }}
      websocket-ref: ${{ inputs.websocket-ref }}

  interop:
    uses: ./.github/workflows/interop.yaml
    with:
      socket-ref: ${{ inputs.socket-ref }}
      websocket-ref: ${{ inputs.websocket-ref }}

  validate:
    needs: [build-linux, build-apple]
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.build-linux.outputs.version }}

  summary:
    name: "Summary"
    if: always()
    needs: [build-linux, build-apple, api-check, platforms, interop, validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Gate table
        env:
          RESULTS: ${{ toJSON(needs) }}
          SOCKET_REF: ${{ inputs.socket-ref }}
          WEBSOCKET_REF: ${{ inputs.websocket-ref }}
        run: |
          {
            echo "## Upstream from source (socket: \`${SOCKET_REF:-catalog}\`, websocket: \`${WEBSOCKET_REF:-catalog}\`)"
            echo "| job | result |"
            echo "|---|---|"
            echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
