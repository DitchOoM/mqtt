name: "Validate Merged Artifacts"

on:
  workflow_call:
    inputs:
      version:
        description: "Version string to validate"
        required: true
        type: string

jobs:
  validate:
    name: "Validate Artifacts"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-local-linux
          path: /tmp/linux-repo/com/ditchoom

      - name: Download Apple artifacts
        uses: actions/download-artifact@v8
        with:
          name: maven-local-apple
          path: /tmp/apple-repo/com/ditchoom

      # Validate the version that was ACTUALLY built into maven-local, not the
      # workflow input. build-linux's getNextVersion reads Maven Central, and if a
      # release publishes mid-CI the input version can diverge from the version
      # build-linux actually stamped onto the artifacts here — then every resolution
      # below looks for a version that was never published and fails spuriously.
      # Deriving from the downloaded artifacts is race-proof: we validate whatever
      # was genuinely built.
      - name: Resolve built version
        run: |
          version=$(ls /tmp/linux-repo/com/ditchoom/mqtt-client/ 2>/dev/null \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [ -z "$version" ]; then
            echo "::error::No mqtt-client version present in the downloaded maven-local " \
              "(/tmp/linux-repo/com/ditchoom/mqtt-client/). build-linux's publish didn't produce " \
              "the artifacts — failing loudly rather than guessing a version to validate."
            exit 1
          fi
          echo "RESOLVED_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Validating version: ${version} (workflow input was '${{ inputs.version }}')"

      - name: Merge artifacts and module metadata
        run: |
          version="${RESOLVED_VERSION}"
          LINUX_BASE="/tmp/linux-repo/com/ditchoom"
          APPLE_BASE="/tmp/apple-repo/com/ditchoom"
          MERGED="/tmp/maven-local/com/ditchoom"

          # Start with Linux artifacts as base
          mkdir -p /tmp/maven-local/com
          cp -r "$LINUX_BASE" /tmp/maven-local/com/

          # Copy Apple per-target artifact directories.
          # Copy the directory CONTENTS ("$dir".) into the target, never the
          # directory itself. The macOS host also publishes the cross-platform
          # publications (-js / -jvm / -android), so those dirs already exist in
          # the merged tree from the Linux base. `cp -r "$dir" "$MERGED/$name"`
          # into an existing target NESTS it as com/ditchoom/<a>/<a>/<version>/,
          # a malformed Maven path that Central Portal validation rejects
          # ("File path ... is not valid for file ..."). Copying contents merges
          # in place. See the "no doubled paths" guard below.
          for dir in "$APPLE_BASE"/mqtt-*-*/; do
            [ -d "$dir" ] || continue
            target_name=$(basename "$dir")
            mkdir -p "$MERGED/$target_name"
            cp -r "$dir". "$MERGED/$target_name/"
          done

          # Merge root module metadata for each module
          for module in mqtt-base-models mqtt-4-models mqtt-5-models mqtt-client; do
            LINUX_MODULE="$LINUX_BASE/$module/$version/$module-$version.module"
            APPLE_MODULE="$APPLE_BASE/$module/$version/$module-$version.module"
            MERGED_MODULE="$MERGED/$module/$version/$module-$version.module"

            if [ -f "$LINUX_MODULE" ] && [ -f "$APPLE_MODULE" ]; then
              jq -s '
                .[0].variants = (
                  [.[0].variants[], .[1].variants[]]
                  | group_by(.name)
                  | map(.[0])
                )
                | .[0]
              ' "$LINUX_MODULE" "$APPLE_MODULE" > "${MERGED_MODULE}.tmp"
              mv "${MERGED_MODULE}.tmp" "$MERGED_MODULE"
              echo "Merged $module metadata: $(jq '.variants | length' "$MERGED_MODULE") variants"
            else
              echo "WARN: Could not merge $module metadata (linux=$([ -f "$LINUX_MODULE" ] && echo yes || echo no), apple=$([ -f "$APPLE_MODULE" ] && echo yes || echo no))"
            fi
          done

      # Central Portal validates every file's path against its Maven coordinates
      # and rejects the whole deployment on the first mismatch. Our Gradle
      # `resolveAll` check only confirms the RIGHT artifacts resolve — it never
      # sees STRAY/malformed dirs. Catch them here, before the 128MB sign+upload,
      # instead of after Central rejects the deployment.
      - name: Assert no malformed (doubled) artifact paths
        run: |
          BASE="/tmp/maven-local/com/ditchoom"
          # A directory nested directly under another of the same name
          # (com/ditchoom/<a>/<a>/) is the doubled-path signature.
          STRAY=$(find "$BASE" -type d -regextype posix-extended -regex '.*/([^/]+)/\1$' || true)
          if [ -n "$STRAY" ]; then
            echo "::error::Malformed artifact paths (artifactId nested under itself) — Central Portal will reject these:"
            echo "$STRAY"
            exit 1
          fi
          echo "No doubled/malformed artifact paths in the merged repo."

      - name: Upload merged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maven-local-merged
          path: /tmp/maven-local
          retention-days: 1

      - name: Validate artifacts
        run: |
          version="${RESOLVED_VERSION}"
          FAILED=false
          BASE="/tmp/maven-local/com/ditchoom"

          echo "=== Validating v${version} Merged Artifacts ==="
          echo ""

          PLATFORMS="jvm js linuxx64 linuxarm64 macosarm64 macosx64 iosarm64 iossimulatorarm64"

          for module in mqtt-base-models mqtt-4-models mqtt-5-models mqtt-client; do
            echo "--- ${module} module metadata ---"
            MODULE_FILE="${BASE}/${module}/${version}/${module}-${version}.module"
            if [ ! -f "$MODULE_FILE" ]; then
              echo "FAIL: ${MODULE_FILE} not found"
              FAILED=true
              continue
            fi
            for platform in $PLATFORMS; do
              if grep -q "$platform" "$MODULE_FILE"; then
                echo "  $platform variant present"
              else
                echo "  FAIL: ${platform} variant not found in ${module} metadata"
                FAILED=true
              fi
            done
            echo ""
          done

          # Apple klibs
          echo "--- Apple klibs ---"
          for module in mqtt-base-models mqtt-4-models mqtt-5-models mqtt-client; do
            for target in macosarm64 macosx64 iosarm64 iossimulatorarm64; do
              KLIB=$(find "${BASE}/${module}-${target}" -name "${module}-${target}-${version}.klib" 2>/dev/null | head -1)
              if [ -z "$KLIB" ]; then
                echo "FAIL: ${module} ${target} klib not found"
                FAILED=true
              else
                echo "  ${module} ${target} klib present"
              fi
            done
          done
          echo ""

          echo "--- Signing Coverage Check ---"
          KNOWN_SIGNABLE="jar klib pom module aar json"
          KNOWN_METADATA="xml repositories"
          UNCOVERED=0
          while IFS= read -r file; do
            ext="${file##*.}"
            COVERED=false
            for known in $KNOWN_SIGNABLE $KNOWN_METADATA; do
              if [ "$ext" = "$known" ]; then
                COVERED=true
                break
              fi
            done
            if [ "$COVERED" = "false" ]; then
              REL=$(echo "$file" | sed "s|${BASE}/||")
              echo "  FAIL: Unsignable file type '.${ext}': ${REL}"
              UNCOVERED=$((UNCOVERED + 1))
            fi
          done < <(find "${BASE}" -type f ! -name "*.md5" ! -name "*.sha1" ! -name "*.asc")
          if [ "$UNCOVERED" -gt 0 ]; then
            echo "  ${UNCOVERED} files with types not covered by publish signing glob"
            FAILED=true
          else
            echo "  All artifact file types covered by signing glob"
          fi
          echo ""

          echo "--- Android & Metadata Artifacts ---"
          for module in mqtt-base-models mqtt-4-models mqtt-5-models mqtt-client; do
            AAR_DIR="${BASE}/${module}-android/${version}"
            if [ -d "$AAR_DIR" ]; then
              AAR=$(find "$AAR_DIR" -name "*.aar" | head -1)
              if [ -z "$AAR" ]; then
                echo "  FAIL: ${module}-android AAR not found in ${AAR_DIR}"
                FAILED=true
              else
                echo "  ${module}-android AAR present"
              fi
            fi
            METADATA="${BASE}/${module}/${version}/${module}-${version}-kotlin-tooling-metadata.json"
            if [ -f "$METADATA" ]; then
              echo "  ${module} kotlin-tooling-metadata.json present"
            else
              echo "  WARN: ${module} kotlin-tooling-metadata.json not found (may not be generated for all modules)"
            fi
          done
          echo ""

          if [ "$FAILED" = true ]; then
            echo "=== VALIDATION FAILED ==="
            exit 1
          fi
          echo "=== ALL VALIDATIONS PASSED ==="

      - name: Checkout validation project
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .ci/validate-resolution
            gradle/libs.versions.toml
          sparse-checkout-cone-mode: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate with Gradle resolution
        run: |
          gradle -p .ci/validate-resolution resolveAll \
            -PmqttVersion=${{ env.RESOLVED_VERSION }} \
            -PmavenRepoPath=/tmp/maven-local \
            --no-daemon
